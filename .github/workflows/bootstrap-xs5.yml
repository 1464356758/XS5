name: Bootstrap XS5 from verified ZIP (one shot)
on:
  push:
    paths:
      - '.github/workflows/bootstrap-xs5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Guard clean workspace and acquire exact uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-tree -r --name-only HEAD)" = '.github/workflows/bootstrap-xs5.yml'
          curl --retry 3 -fLSs 'https://raw.githubusercontent.com/1464356758/xiaishuo-ZUOZONG/a7874223300e0fcf467b06f76dbe0b58a566a504/%E5%88%9D%E5%A7%8B%E5%8C%96%E7%B3%BB%E7%BB%9F%E5%8C%85.zip' -o /tmp/xs5-init.zip
          echo 'e443e510f6da8367688bccb1c5d133210b60ac19c788e4877165a61084c70f86  /tmp/xs5-init.zip' | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib, json
          with ZipFile('/tmp/xs5-init.zip') as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==97 and 'INIT_MANIFEST.json' in names
              assert all(not Path(x).is_absolute() and '..' not in Path(x).parts for x in names)
              z.extractall('.')
          m=json.loads(Path('INIT_MANIFEST.json').read_text(encoding='utf-8'))
          assert len(m['files'])==96 and set(names)==set(m['files'])|{'INIT_MANIFEST.json'}
          for name,sha in m['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
          print('EXACT_ZIP_MANIFEST_OK',len(names))
          PY
      - name: Bootstrap unique identity and select Migu
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/online_state.py bootstrap --repo https://github.com/1464356758/XS5 --branch main
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('platforms.json')
          v=json.loads(p.read_text(encoding='utf-8'))
          assert not any(x['id']=='migu' for x in v['platforms'])
          v['platforms'].append({'id':'migu','name':'咪咕文学／咪咕阅读','official_domains':['cmread.com','migu.cn','migu.com'],'writer_url':'https://www.cmread.com/wenxuenew/','ranking_url':'https://www.cmread.com/wenxuenew/'})
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          state=json.loads(Path('book/state.json').read_text())
          config=Path('.automation/config.json')
          v=json.loads(config.read_text());assert v['book_id'] is None and v['automation_id'] is None
          v['book_id']=state['book_id']
          config.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 tools/online_state.py select-platform --platform migu
      - name: Save verified-source partial research and eight original candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib, json
          payload=''
          data=json.loads(zlib.decompress(base64.b64decode(payload)))
          Path('/tmp/xs5-migu-research.json').write_text(data['research'],encoding='utf-8')
          Path('/tmp/xs5-migu-topics.json').write_text(data['topics'],encoding='utf-8')
          assert len(json.loads(data['topics'])['candidates'])==8
          PY
          python3 tools/online_state.py research --file /tmp/xs5-migu-research.json
          python3 tools/online_state.py topics --file /tmp/xs5-migu-topics.json
          python3 tools/online_state.py validate-index
          python3 - <<'PY'
          import json
          s=json.load(open('book/state.json'));w=json.load(open('book/workflow.json'));a=json.load(open('.automation/config.json'))
          assert w['platform']=='migu' and w['phase']=='WAITING_TOPIC'
          assert not s['chapters'] and a['book_id']==s['book_id'] and a['automation_id'] is None
          assert s['config']['serial_mode'] and s['config']['narrative_review_required']
          print('BOOK_ID',s['book_id'],'PHASE',w['phase'],'NO_CHAPTERS',True)
          PY
      - name: Basic executable verification
        run: |
          set -euo pipefail
          python3 -m compileall -q tools
          python3 -m unittest discover -s tests -p 'test_online_state.py' -q
          python3 tools/online_state.py validate-index
      - name: Nonforce fast-forward commit and remote readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -q HEAD -- .github/workflows/novel-executor.yml .github/workflows/validate.yml
          git commit -m 'init: bootstrap independent XS5 and save Migu topic research'
          git fetch --quiet origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
          git fetch --quiet origin main
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          for f in AGENTS.md tools/online_state.py book/state.json book/workflow.json online/index.json .automation/config.json; do
            diff -q "$f" <(git show "FETCH_HEAD:$f")
          done
          python3 tools/online_state.py validate-index
          echo "DEPLOYMENT_REMOTE_READBACK_PASS $(git rev-parse HEAD)"
