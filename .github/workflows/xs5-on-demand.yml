name: XS5 legacy executor retired
on:
  push:
    paths:
      - '.automation/command.json'
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired command entrypoint
        run: |
          echo 'Legacy executor retired. Use .automation/request.json and novel-executor.yml.'
          exit 1
