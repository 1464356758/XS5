name: XS5 CH001 manuscript prepare (no adoption)
on:
  push:
    paths:
      - '.github/workflows/prepare-xs5-ch001.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Guard exact identity and untouched chapter one
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('book/state.json').read_text())
          w=json.loads(Path('book/workflow.json').read_text())
          assert s['book_id']==w['book_id']=='2b285e23-d842-4102-9f56-c55a1d6357b0'
          assert w['phase']=='PLANNING' and w['selected_topic']['id']=='T14' and w['platform']=='migu'
          assert s['revision']==3 and not s['chapters'] and not s['tasks']
          assert set(s['inputs'])=={'canon','roadmap'} and s['serialization']['enabled']
          assert not (Path('book/daily/active.json').exists())
          assert not Path('drafts/CH001_未审全文.txt').exists()
          PY
      - name: Register precise writing brief, form complete text, and check length
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/online_state.py task --phase WRITING --chapter 1 --detail '作者已授权第一章；已完成全文起草，执行候选与引用审核。' --next '实读完整正文、制作章后事实及因果记录、叙事审读、正式冻结检查。'
          python3 tools/novel_state.py --root book brief-request --out drafts/CH001_任务书.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('drafts/CH001_任务书.json')
          v=json.loads(p.read_text())
          v.update(decision='ready',
          writer_brief='程桑在北岗实测九分雨，却收到预先盖印的全县零雨合报。她从观雨棚到城内赈棚，再走进县署，试图让局部降水留下可追溯的官方异议，同时必须面对错误上报可能触发三日缓粮的真实代价。要通过具体见证、救助与县丞谈判呈现她的局限；本章只取得有时辰、有边界的待核收文，不提前让州府改报或解决粮仓。',
          hard_boundaries=[
          '主角只有北岗站实测资格，不能凭一支铜尺断定全县有雨，也没有县署公印和粮仓调拨权。',
          '城东和南洼的降雨须靠各站独立观察，今日只能见北岗九分；县署合报已预填全县零雨。',
          '县仓五百一十石为账面数，日发二十二石为基准；兵粮不可擅调，救急粮有独立核票程序。',
          '宋榆在雨后到棚，只能见测尺复读，不能冒充落雨目击者；县丞有救粮动机也须面对隐报责任。',
          '正文不得出现穿越、重生、系统、神力、现代通信或万能水工奇迹；八千到一万汉字完整章，不靠复述填充。',
          '已有用户授权仅为CH001写作与冻结；不得提前写CH002或登记咪咕发表。'
          ],
          reader_promise='首800汉字发生九分雨与零雨官印冲突，3000字内交代州府缓发粮与主角切身风险；本章有一次真实的小范围民生兑现和不彻底但可质证的收文成果，结尾引向城东零雨核实。',
          history_queries=[],
          scene_plan=[
          {'purpose':'北岗观雨棚实测九分；收预印零雨报；宋榆分清见证与未见事实，形成第一份原簿记录。','target_han':1600},
          {'purpose':'过石桥见不同旱情，到赈棚看见发粮号牌停发，粮情与主角争执交叉。','target_han':1750},
          {'purpose':'仓簿官区分账数与可发米，病弱家庭依法凭医证与保人取得一份急补。','target_han':1850},
          {'purpose':'与贺县丞当堂争论雨、田、仓的证据权限；以可质证收文代替强改合报，付职业风险。','target_han':2050},
          {'purpose':'逐字核验收文见证与上报时辰，发现官报仍离县；母亲南洼干叶提醒局部雨不可当全县雨，决定去城东。','target_han':1750}
          ])
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 tools/novel_state.py --root book brief-check --file drafts/CH001_任务书.json
          python3 tools/novel_state.py --root book context --profile writer --out drafts/CH001_writer_context.txt
          python3 - <<'PY'
          from pathlib import Path
          parts=[Path(f'drafts/CH001_parts/part_{n:02d}.txt').read_text(encoding='utf-8').strip() for n in range(1,11)]
          assert len(parts)==10 and all(len(part)>500 for part in parts)
          text='\n\n'.join(parts)+'\n'
          Path('drafts/CH001_未审全文.txt').write_text(text,encoding='utf-8')
          import sys
          sys.path.insert(0,'tools')
          import novel_state as ns
          count=ns.han_count(text)
          print('MEASURED_HAN',count,'BODY_SHA256',ns.digest(text))
          assert 8000<=count<=10000, count
          assert text.startswith('铜雨筒里的水，已经漫过第九道细线。')
          assert text.rstrip().endswith('这一次，零也必须是真的。')
          assert '按时记了' not in text
          assert not ns.narrative_module().surface_scan(text)
          PY
          python3 tools/novel_state.py --root book count drafts/CH001_未审全文.txt
          python3 tools/novel_state.py --root book candidate --chapter 1 --text drafts/CH001_未审全文.txt
          python3 tools/online_state.py task --phase REVIEWING --chapter 1 --detail 'CH001《印比雨先到》完整草稿实测字数达标，已登记唯一候选；正在逐项做正文证据、因果及叙事审核，尚未采用。' --next '复核关键时序、粮权、知情与局部救粮兑现；release-check通过才冻结。'
          python3 tools/online_state.py validate-index
          python3 tools/novel_state.py --root book status
      - name: Commit only candidate, its brief, and synchronized progress
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_online_state.py' -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/state.json book/workflow.json book/briefs book/candidates online/index.json
          git add -f drafts/CH001_任务书.json drafts/CH001_writer_context.txt drafts/CH001_未审全文.txt
          git diff --cached --quiet && { echo 'No pending candidate changes'; exit 1; }
          git commit -m 'draft(xs5): register full CH001 candidate after word-count and brief checks'
          git fetch --quiet origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
          git fetch --quiet origin main
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          for f in book/state.json book/workflow.json online/index.json drafts/CH001_未审全文.txt; do diff -q "$f" <(git show "FETCH_HEAD:$f"); done
          echo "CH001_CANDIDATE_REMOTE_READBACK_PASS $(git rev-parse HEAD)"
